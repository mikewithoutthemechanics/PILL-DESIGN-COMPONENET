<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Integrations Pill Marquee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pill-bg: #f3f3f3;
    --pill-bg-hover: #ededed;
    --ink: #2c2c2c;
    --label: #3a3a3a;
    --page: #ffffff;
  }

  *{ box-sizing: border-box; }

  html,body{ margin:0; padding:0; }

  body{
    background: var(--page);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .marquee-section{
    width: 100%;
    padding: 48px 0;
    position: relative;
  }

  /* soft warm glow behind the middle of the marquee, like the reference */
  .marquee-section::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width: min(760px, 90vw);
    height: 460px;
    transform: translate(-50%,-50%);
    background:
      radial-gradient(closest-side, rgba(255,214,232,.55), rgba(255,214,232,0) 70%),
      radial-gradient(closest-side, rgba(255,241,196,.55), rgba(255,241,196,0) 72%);
    background-position: 42% 50%, 60% 50%;
    background-size: 70% 100%, 70% 100%;
    background-repeat: no-repeat;
    filter: blur(28px);
    pointer-events:none;
    z-index:0;
  }

  .rows{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .marquee{
    overflow: hidden;
    width: 100%;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
  }

  .track{
    display: flex;
    align-items: center;
    gap: 18px;
    width: max-content;
    will-change: transform;
    animation: scroll-left var(--dur, 42s) linear infinite;
  }
  .track.reverse{ animation-name: scroll-right; }

  .marquee:hover .track{ animation-play-state: paused; }

  @keyframes scroll-left{
    from{ transform: translate3d(0,0,0); }
    to{ transform: translate3d(-50%,0,0); }
  }
  @keyframes scroll-right{
    from{ transform: translate3d(-50%,0,0); }
    to{ transform: translate3d(0,0,0); }
  }

  .pill{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 34px;
    padding: 20px 26px;
    min-width: 240px;
    border-radius: 22px;
    background: var(--pill-bg);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      0 1px 2px rgba(23,23,23,.04),
      0 6px 18px -10px rgba(23,23,23,.10);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), background .3s ease, box-shadow .35s ease;
    cursor: default;
    user-select: none;
  }
  .pill:hover{
    background: var(--pill-bg-hover);
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      0 2px 4px rgba(23,23,23,.05),
      0 14px 30px -14px rgba(23,23,23,.20);
  }

  .pill .label{
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--label);
    white-space: nowrap;
    margin-right: auto;
  }

  .pill .icon{
    width: 38px;
    height: 38px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    color: var(--ink);
  }
  .pill .icon svg{ width: 100%; height: 100%; display:block; }

  /* stagger rows a bit so pills never line up in a grid */
  .row-2 .track{ padding-left: 90px; }
  .row-3 .track{ padding-left: 40px; }

  @media (max-width: 768px){
    .pill{
      min-width: 176px;
      gap: 20px;
      padding: 15px 18px;
      border-radius: 18px;
    }
    .pill .label{ font-size: 15px; }
    .pill .icon{ width: 28px; height: 28px; }
    .rows{ gap: 12px; }
    .track{ gap: 12px; }
    .marquee-section::before{ height: 320px; filter: blur(22px); }
    .row-2 .track{ padding-left: 46px; }
    .row-3 .track{ padding-left: 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    .track{ animation-duration: 160s; }
  }

  /* ---- icon sprite is hidden, referenced via <use> ---- */
  #sprite{ display:none; }
</style>
</head>

<section class="marquee-section" aria-label="Integrations">
  <div class="rows">
    <div class="marquee row-1"><div class="track" data-row="1" style="--dur:52s"></div></div>
    <div class="marquee row-2"><div class="track reverse" data-row="2" style="--dur:60s"></div></div>
    <div class="marquee row-3"><div class="track" data-row="3" style="--dur:56s"></div></div>
  </div>
</section>

<script>
  const rows = {
    1: [
      ["Zapier","i-star8"],["Make","i-star8"],["Custom APIs","i-grid"],["HubSpot","i-sun"],
      ["Salesforce","i-s"],["Zoho","i-diamond"],["Airtable","i-rings"],["Notion","i-cube"]
    ],
    2: [
      ["Customer.io","i-blob"],["Pipedrive","i-cube"],["Attio","i-bolt"],["Copper","i-hexblob"],
      ["Close","i-layers"],["Folk","i-quad"],["Intercom","i-rings"],["Segment","i-flower"]
    ],
    3: [
      ["LiveChat","i-waves"],["Pabbly","i-quad"],["Workato","i-spiral"],["Anthropic","i-n"],
      ["Vertex","i-flower"],["Azure AI","i-bolt"],["OpenAI","i-star8"],["Mistral","i-grid"]
    ]
  };

  function pill(label, icon){
    return `<div class="pill">
      <span class="label">${label}</span>
      <span class="icon" aria-hidden="true"><svg><use href="#${icon}"></use></svg></span>
    </div>`;
  }

  document.querySelectorAll('.track').forEach(track => {
    const items = rows[track.dataset.row];
    // repeat set enough times to comfortably fill wide screens, then duplicate for the loop
    let set = '';
    const reps = 2;
    for (let r = 0; r < reps; r++) set += items.map(i => pill(i[0], i[1])).join('');
    track.innerHTML = set + set; // second half = seamless -50% loop
  });
</script>
